  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563EB" />
    <title>Lezato · MenuDe-Prueba | Restaurant Admin Dashboard</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap');

/* ==========================================================================
   SISTEMA DE PALETAS DE NEGOCIOS (BUSINESS COLOR PALETTES) + DARK MODE
   1. "executive" (Por defecto): Azul Cobalto Ejecutivo + Ámbar Culinario + Esmeralda
   2. "lezato": Naranja Gastronómico Original (#FF5C00) + Púrpura Real (#6C5DD3)
   3. "emerald": Esmeralda Bistro (#0D9488) + Índigo Ejecutivo (#6366F1)
   4. "burgundy": Borgoña Reserva (#BE123C) + Oro Cálido (#D97706)
   ========================================================================== */

:root,
[data-palette="executive"] {
  --bg: #F4F6FA;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;
  --surface-3: #EEF2F7;
  --sidebar-bg: #FFFFFF;
  --topbar-bg: rgba(255, 255, 255, 0.96);
  --primary: #2563EB;
  --primary-2: #3B82F6;
  --primary-dark: #1D4ED8;
  --primary-soft: #EFF6FF;
  --primary-ring: rgba(37, 99, 235, 0.16);
  --accent: #EA580C;
  --accent-2: #F97316;
  --accent-soft: #FFF7ED;
  --purple: #6C5DD3;
  --purple-soft: #F2F0FF;
  --text: #1E293B;
  --text-strong: #0F172A;
  --muted: #64748B;
  --muted-light: #94A3B8;
  --line: #E2E8F0;
  --line-soft: #F1F5F9;
  --danger: #EF4444;
  --danger-soft: #FEF2F2;
  --warning: #F59E0B;
  --warning-soft: #FFFBEB;
  --success: #10B981;
  --success-soft: #ECFDF5;
  --radius-lg: 20px;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 10px 30px rgba(15, 23, 42, 0.045);
  --shadow-hover: 0 16px 36px rgba(15, 23, 42, 0.085);
}

[data-palette="lezato"] {
  --bg: #F8F9FA;
  --surface: #FFFFFF;
  --surface-2: #F9FAFB;
  --surface-3: #F3F4F6;
  --sidebar-bg: #FFFFFF;
  --topbar-bg: rgba(255, 255, 255, 0.96);
  --primary: #FF5C00;
  --primary-2: #FF7A29;
  --primary-dark: #E04F00;
  --primary-soft: #FFF0EB;
  --primary-ring: rgba(255, 92, 0, 0.16);
  --accent: #6C5DD3;
  --accent-2: #8073DF;
  --accent-soft: #F2F0FF;
  --purple: #6C5DD3;
  --purple-soft: #F2F0FF;
  --text: #1E1E2D;
  --text-strong: #11111D;
  --muted: #7E8299;
  --muted-light: #9FA4B8;
  --line: #ECECF2;
  --line-soft: #F4F4F8;
  --danger: #F1416C;
  --danger-soft: #FFF5F8;
  --warning: #FFC700;
  --warning-soft: #FFF8DD;
  --success: #2BC155;
  --success-soft: #E8FFF3;
}

[data-palette="emerald"] {
  --bg: #F4F8F7;
  --surface: #FFFFFF;
  --surface-2: #F7FBFA;
  --surface-3: #EBF3F1;
  --sidebar-bg: #FFFFFF;
  --topbar-bg: rgba(255, 255, 255, 0.96);
  --primary: #0D9488;
  --primary-2: #14B8A6;
  --primary-dark: #0F766E;
  --primary-soft: #CCFBF1;
  --primary-ring: rgba(13, 148, 136, 0.16);
  --accent: #6366F1;
  --accent-2: #818CF8;
  --accent-soft: #EEF2FF;
  --purple: #6366F1;
  --purple-soft: #EEF2FF;
  --text: #1F2937;
  --text-strong: #111827;
  --muted: #6B7280;
  --muted-light: #9CA3AF;
  --line: #E5E7EB;
  --line-soft: #F3F4F6;
  --danger: #E11D48;
  --danger-soft: #FFE4E6;
  --warning: #D97706;
  --warning-soft: #FEF3C7;
  --success: #059669;
  --success-soft: #D1FAE5;
}

[data-palette="burgundy"] {
  --bg: #FAF7F5;
  --surface: #FFFFFF;
  --surface-2: #FDFBF9;
  --surface-3: #F5EFEA;
  --sidebar-bg: #FFFFFF;
  --topbar-bg: rgba(255, 255, 255, 0.96);
  --primary: #BE123C;
  --primary-2: #E11D48;
  --primary-dark: #9F1239;
  --primary-soft: #FFE4E6;
  --primary-ring: rgba(190, 18, 60, 0.15);
  --accent: #D97706;
  --accent-2: #F59E0B;
  --accent-soft: #FEF3C7;
  --purple: #7C3AED;
  --purple-soft: #F3E8FF;
  --text: #292524;
  --text-strong: #1C1917;
  --muted: #78716C;
  --muted-light: #A8A29E;
  --line: #E7E5E4;
  --line-soft: #F5F5F4;
  --danger: #DC2626;
  --danger-soft: #FEF2F2;
  --warning: #D97706;
  --warning-soft: #FEF3C7;
  --success: #15803D;
  --success-soft: #DCFCE7;
}

[data-theme="dark"] {
  --bg: #13151F;
  --surface: #1C1F2E;
  --surface-2: #24283B;
  --surface-3: #2D324A;
  --sidebar-bg: #1C1F2E;
  --topbar-bg: rgba(28, 31, 46, 0.95);
  --text: #E2E8F0;
  --text-strong: #FFFFFF;
  --muted: #94A3B8;
  --muted-light: #64748B;
  --line: #2E344D;
  --line-soft: #252A40;
  --primary-soft: rgba(59, 130, 246, 0.16);
  --accent-soft: rgba(234, 88, 12, 0.16);
  --purple-soft: rgba(108, 93, 211, 0.2);
  --danger-soft: rgba(239, 68, 68, 0.18);
  --warning-soft: rgba(245, 158, 11, 0.18);
  --success-soft: rgba(16, 185, 129, 0.18);
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
  --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.42);
}

[data-theme="dark"][data-palette="lezato"] {
  --primary-soft: rgba(255, 92, 0, 0.18);
}
[data-theme="dark"][data-palette="emerald"] {
  --primary-soft: rgba(20, 184, 166, 0.18);
}
[data-theme="dark"][data-palette="burgundy"] {
  --primary-soft: rgba(225, 29, 72, 0.2);
}

* {
  box-sizing: border-box;
}

html, body, #root {
  min-height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Poppins', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  transition: background-color 0.25s ease, color 0.25s ease;
}

button, input, select, textarea {
  font-family: inherit;
}

button {
  cursor: pointer;
  transition: all 0.18s ease;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.48;
}

input, select, textarea {
  min-height: 44px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  padding: 10px 14px;
  font-size: 13.5px;
  outline: none;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}

input:focus, select:focus, textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-ring);
}

/* ==========================================================================
   APP SHELL & SIDEBAR (ESTILO LEZATO)
   ========================================================================== */

.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 272px;
  background: var(--sidebar-bg);
  color: var(--text);
  border-right: 1px solid var(--line);
  padding: 0 18px 24px;
  overflow-y: auto;
  z-index: 45;
  transition: width 0.25s ease, transform 0.25s ease, background-color 0.25s ease;
}

.app-shell.sidebar-collapsed .sidebar {
  width: 84px;
  padding: 0 12px 20px;
}

.app-shell.sidebar-collapsed .brand-text,
.app-shell.sidebar-collapsed .sidebar-label,
.app-shell.sidebar-collapsed .nav-parent-label,
.app-shell.sidebar-collapsed .chevron,
.app-shell.sidebar-collapsed .nav-children,
.app-shell.sidebar-collapsed .custom-menu-box,
.app-shell.sidebar-collapsed .sidebar-card {
  display: none;
}

.app-shell.sidebar-collapsed .brand {
  justify-content: center;
  padding: 0;
}

.app-shell.sidebar-collapsed .nav-parent {
  justify-content: center;
  padding: 13px;
}

.brand {
  height: 88px;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 0 6px;
  border-bottom: 1px solid var(--line-soft);
  margin-bottom: 14px;
}

.brand-mark {
  width: 48px;
  height: 48px;
  border-radius: 15px;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  color: #FFFFFF;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 22px;
  flex-shrink: 0;
  box-shadow: 0 8px 20px var(--primary-ring);
}

.brand-text strong {
  display: block;
  color: var(--text-strong);
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1.15;
}

.brand-text strong i {
  color: var(--primary);
  font-style: normal;
}

.brand-text small {
  display: block;
  color: var(--muted-light);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.2px;
  margin-top: 2px;
}

.sidebar-close {
  display: none;
  margin-left: auto;
  border: 0;
  background: var(--surface-2);
  color: var(--text);
  width: 34px;
  height: 34px;
  border-radius: 8px;
}

.sidebar-label {
  font-size: 10.5px;
  letter-spacing: 1.3px;
  color: var(--muted-light);
  padding: 10px 14px 8px;
  font-weight: 700;
  text-transform: uppercase;
}

.side-nav {
  display: grid;
  gap: 4px;
}

.nav-parent {
  width: 100%;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 12px;
  padding: 11px 14px;
  font-size: 14.5px;
  font-weight: 500;
}

.nav-parent-left {
  display: flex;
  gap: 13px;
  align-items: center;
}

.nav-parent-left .svg-icon {
  width: 20px;
  height: 20px;
  color: var(--muted-light);
  transition: color 0.18s ease;
}

.nav-parent:hover,
.nav-parent.has-active {
  background: var(--primary-soft);
  color: var(--primary);
  font-weight: 600;
}

.nav-parent:hover .svg-icon,
.nav-parent.has-active .svg-icon {
  color: var(--primary);
}

.chevron {
  color: var(--muted-light);
  transition: transform 0.2s ease;
  display: inline-flex;
}

.chevron.down {
  transform: rotate(90deg);
}

.nav-children {
  display: grid;
  gap: 2px;
  padding: 4px 0 8px 34px;
  position: relative;
}

.nav-children::before {
  content: '';
  position: absolute;
  left: 23px;
  top: 8px;
  bottom: 12px;
  width: 1.5px;
  background: var(--line);
}

.nav-children button {
  min-height: 38px;
  border: 0;
  background: transparent;
  color: var(--muted);
  text-align: left;
  padding: 7px 12px;
  border-radius: 9px;
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 13px;
  font-weight: 500;
}

.nav-children button:hover {
  color: var(--text-strong);
  background: var(--surface-2);
}

.nav-children button.active {
  color: var(--primary);
  font-weight: 700;
  background: transparent;
}

.tiny-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.65;
  transition: transform 0.18s ease;
}

.nav-children button.active .tiny-dot {
  transform: scale(1.4);
  opacity: 1;
}

.custom-menu-box {
  margin: 4px 6px 8px 28px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface-2);
}

.custom-menu-box form {
  display: flex;
  gap: 6px;
}

.custom-menu-box input {
  min-width: 0;
  min-height: 36px;
  width: 100%;
  padding: 6px 10px;
  font-size: 12px;
}

.custom-menu-box form button {
  border: 0;
  border-radius: 8px;
  background: var(--primary);
  color: #fff;
  padding: 0 12px;
  font-size: 11.5px;
  font-weight: 600;
}

.custom-menu-box small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 8px;
  line-height: 1.45;
}

.custom-link {
  display: flex;
  margin-top: 6px;
  gap: 5px;
}

.custom-link > button:first-child {
  flex: 1;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  text-align: left;
  padding: 7px 10px;
  font-size: 12px;
  font-weight: 500;
}

.remove-mini {
  width: 30px;
  border: 0;
  border-radius: 8px;
  background: var(--danger-soft);
  color: var(--danger);
  font-weight: 700;
}

.sidebar-card {
  margin: 24px 4px 0;
  padding: 20px 18px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: linear-gradient(145deg, var(--primary-soft), var(--purple-soft));
  position: relative;
  overflow: hidden;
}

.sidebar-card-illus {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: var(--surface);
  color: var(--primary);
  display: grid;
  place-items: center;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}

.sidebar-card span {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.1px;
  color: var(--primary);
  text-transform: uppercase;
}

.sidebar-card strong {
  display: block;
  color: var(--text-strong);
  margin: 5px 0 6px;
  font-size: 14px;
  line-height: 1.35;
}

.sidebar-card p {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.5;
}

.sidebar-copyright {
  font-size: 11px;
  color: var(--muted-light);
  padding: 16px 10px 0;
  text-align: center;
}

/* ==========================================================================
   MAIN COLUMN & TOPBAR (HEADER LEZATO)
   ========================================================================== */

.main-column {
  margin-left: 272px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: margin-left 0.25s ease;
}

.app-shell.sidebar-collapsed .main-column {
  margin-left: 84px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 35;
  height: 84px;
  padding: 0 34px;
  gap: 20px;
  background: var(--topbar-bg);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line-soft);
  box-shadow: 0 3px 16px rgba(15, 23, 42, 0.03);
  display: flex;
  align-items: center;
}

.hamburger-btn {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text-strong);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.hamburger-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.topbar-page-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-strong);
  letter-spacing: -0.5px;
  white-space: nowrap;
  margin-right: 8px;
}

.global-search {
  position: relative;
  width: min(390px, 34vw);
  height: 46px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 16px;
  color: var(--muted-light);
}

.global-search input {
  width: 100%;
  border: 0;
  background: transparent;
  box-shadow: none;
  padding: 6px 8px 6px 0;
  min-height: unset;
  font-size: 13.5px;
}

.search-popover {
  position: absolute;
  top: 52px;
  left: 0;
  right: 0;
  padding: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-hover);
  z-index: 60;
}

.search-popover button {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 0;
  background: transparent;
  padding: 10px 12px;
  border-radius: 10px;
  color: var(--text);
  font-size: 13px;
}

.search-popover button:hover {
  background: var(--primary-soft);
  color: var(--primary);
}

.search-popover small {
  color: var(--muted);
  font-size: 11px;
}

.topbar-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.palette-quick-btn {
  height: 42px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text);
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  font-weight: 600;
}

.palette-quick-btn:hover {
  border-color: var(--primary);
}

.palette-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
}

.recipe-button,
.primary {
  min-height: 44px;
  border: 0;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  color: #FFFFFF;
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 8px 20px var(--primary-ring);
}

.recipe-button:hover,
.primary:hover {
  background: var(--primary-dark);
  transform: translateY(-1px);
}

.icon-button {
  position: relative;
  width: 44px;
  height: 44px;
  border: 1px solid var(--line-soft);
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--muted);
  display: grid;
  place-items: center;
}

.icon-button:hover {
  background: var(--primary-soft);
  color: var(--primary);
}

.badge-counter {
  position: absolute;
  top: -3px;
  right: -3px;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--danger);
  color: #FFFFFF;
  font-size: 10px;
  font-weight: 700;
  display: grid;
  place-items: center;
  border: 2px solid var(--surface);
}

.badge-counter.accent {
  background: var(--accent);
}

.popover-Wrapper {
  position: relative;
}

.dropdown-panel {
  position: absolute;
  top: 54px;
  right: 0;
  width: 320px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow-hover);
  padding: 16px;
  z-index: 65;
}

.dropdown-panel h4 {
  margin: 0 0 10px;
  font-size: 14px;
  color: var(--text-strong);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.dropdown-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 10px;
  border-bottom: 1px solid var(--line-soft);
  font-size: 12px;
}

.dropdown-item:last-child {
  border-bottom: 0;
}

.profile-chip {
  display: flex;
  align-items: center;
  gap: 11px;
  padding-left: 6px;
  cursor: pointer;
}

.avatar {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary-soft), var(--purple-soft));
  color: var(--primary);
  font-weight: 800;
  font-size: 13px;
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 2px var(--primary);
  flex-shrink: 0;
}

.profile-chip strong {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-strong);
}

.profile-chip small {
  display: block;
  color: var(--muted);
  font-size: 11px;
}

/* ==========================================================================
   CONTENT & LEZATO DASHBOARD GRID ARCHITECTURE
   ========================================================================== */

.content {
  padding: 28px 34px 54px;
  flex: 1;
}

.page-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.page-head-left h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  color: var(--text-strong);
  letter-spacing: -0.4px;
}

.page-head-left p {
  margin: 3px 0 0;
  font-size: 12.5px;
  color: var(--muted);
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12.5px;
  background: var(--surface);
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid var(--line);
}

.breadcrumb strong {
  color: var(--primary);
  font-weight: 600;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 24px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.panel-title {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.panel-title h2 {
  margin: 0 0 4px;
  font-size: 18px;
  font-weight: 700;
  color: var(--text-strong);
  letter-spacing: -0.3px;
}

.panel-title p {
  margin: 0;
  font-size: 12px;
  color: var(--muted);
}

.panel-title-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.pill-tab {
  border: 0;
  background: var(--surface-2);
  color: var(--muted);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 11.5px;
  font-weight: 600;
}

.pill-tab.active {
  background: var(--primary);
  color: #FFFFFF;
  box-shadow: 0 4px 12px var(--primary-ring);
}

/* TOP ROW: 2x2 Stat Cards (Left) + Today's Revenue Area Wave (Right) */
.lezato-top-grid {
  display: grid;
  grid-template-columns: minmax(420px, 0.98fr) minmax(460px, 1.15fr);
  gap: 24px;
  margin-bottom: 24px;
}

.lezato-stats-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg);
  padding: 22px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  box-shadow: var(--shadow);
  min-height: 136px;
  position: relative;
  overflow: hidden;
}

.stat-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
}

.stat-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.stat-info strong {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.8px;
  color: var(--text-strong);
  line-height: 1.15;
}

.stat-info span {
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
}

.stat-info small {
  font-size: 11px;
  color: var(--success);
  font-weight: 600;
  margin-top: 2px;
}

.stat-info small.danger-text {
  color: var(--danger);
}

/* Circular Donut Progress Ring on Stat Cards (Signature Lezato Element) */
.stat-donut-ring {
  position: relative;
  width: 68px;
  height: 68px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.stat-donut-ring svg.ring-svg {
  position: absolute;
  inset: 0;
  width: 68px;
  height: 68px;
  transform: rotate(-90deg);
}

.stat-donut-ring .ring-bg {
  fill: none;
  stroke: var(--purple-soft);
  stroke-width: 6;
}

.stat-donut-ring .ring-meter {
  fill: none;
  stroke: var(--purple);
  stroke-width: 6;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.5s ease;
}

.stat-donut-inner {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--purple-soft);
  color: var(--purple);
  display: grid;
  place-items: center;
  font-weight: 700;
}

/* Today's Revenue Feature Card */
.dashboard-revenue {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 292px;
}

.revenue-metrics-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.revenue-primary-figure strong {
  font-size: 30px;
  font-weight: 800;
  color: var(--text-strong);
  letter-spacing: -0.7px;
}

.revenue-growth-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 700;
  color: var(--success);
  background: var(--success-soft);
  padding: 5px 12px;
  border-radius: 999px;
}

.chart-wrap {
  position: relative;
  height: 175px;
  color: var(--primary);
  margin-top: 6px;
}

.chart-wrap svg {
  width: 100%;
  height: 145px;
  overflow: visible;
}

.axis {
  display: flex;
  justify-content: space-between;
  color: var(--muted-light);
  font-size: 11px;
  font-weight: 500;
  padding-top: 4px;
}

/* MAIN 2-COLUMN ASYMMETRIC LEZATO LAYOUT (40% Left / 60% Right) */
.lezato-main-columns {
  display: grid;
  grid-template-columns: minmax(340px, 0.41fr) minmax(520px, 0.59fr);
  gap: 24px;
  align-items: start;
}

.lezato-col-left,
.lezato-col-right {
  display: grid;
  gap: 24px;
}

/* Daily Trending Menus (Lezato Ranked List with Dish Thumbnail on Right) */
.menu-ranking {
  display: grid;
  gap: 6px;
}

.trending-item {
  display: grid;
  grid-template-columns: 36px 1fr 60px;
  align-items: center;
  gap: 12px;
  padding: 11px 4px;
  border-bottom: 1px solid var(--line-soft);
  transition: background-color 0.15s ease;
  border-radius: 10px;
}

.trending-item:last-child {
  border-bottom: 0;
}

.trending-item:hover {
  background: var(--surface-2);
}

.rank-number {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--primary-soft);
  color: var(--primary);
  font-weight: 800;
  font-size: 12.5px;
  display: grid;
  place-items: center;
}

.trending-meta strong {
  display: block;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-strong);
  margin-bottom: 4px;
}

.trending-sub {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
}

.trending-sub b {
  color: var(--primary);
  font-weight: 700;
}

.trending-sub small {
  color: var(--muted);
  font-size: 11.5px;
}

.rank-thumb-box {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--surface-2), var(--primary-soft));
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 26px;
  position: relative;
}

/* Trending Keyword Card with Progress Bars + Tag Pills */
.keyword-bars-list {
  display: grid;
  gap: 14px;
  margin-bottom: 20px;
}

.keyword-bar-item {
  display: grid;
  gap: 6px;
}

.keyword-bar-top {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  font-weight: 600;
}

.keyword-bar-top span {
  color: var(--primary);
}

.keyword-bar-top b {
  color: var(--muted);
  font-weight: 500;
}

.keyword-progress-track {
  height: 8px;
  background: var(--surface-3);
  border-radius: 999px;
  overflow: hidden;
}

.keyword-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--primary-2));
  border-radius: 999px;
}

.others-tag-section h4 {
  margin: 0 0 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-strong);
}

.tag-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.tag-pill {
  border: 1px solid var(--primary);
  background: var(--primary-soft);
  color: var(--primary);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 11.5px;
  font-weight: 600;
}

.tag-pill:hover {
  background: var(--primary);
  color: #FFFFFF;
}

/* Customer Map Vertical Bar Chart */
.customer-bars-container {
  height: 245px;
  position: relative;
  padding: 14px 8px 28px 36px;
}

.y-axis-labels {
  position: absolute;
  left: 0;
  top: 10px;
  bottom: 28px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  font-size: 10px;
  color: var(--muted-light);
}

.chart-grid-lines {
  position: absolute;
  left: 36px;
  right: 8px;
  top: 14px;
  bottom: 28px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.chart-grid-lines i {
  display: block;
  border-top: 1px dashed var(--line);
}

.bars {
  position: absolute;
  left: 42px;
  right: 12px;
  top: 16px;
  bottom: 30px;
  display: flex;
  align-items: flex-end;
  gap: 7px;
}

.bar-col {
  flex: 1;
  height: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  position: relative;
}

.bar-col span {
  width: 100%;
  max-width: 12px;
  border-radius: 4px 4px 0 0;
  background: linear-gradient(180deg, var(--primary-2), var(--primary));
  transition: height 0.35s ease, opacity 0.2s ease;
}

.bar-col span.alt-bar {
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  opacity: 0.85;
}

.bar-col:hover span {
  opacity: 1;
  filter: brightness(1.1);
}

.bars-axis {
  position: absolute;
  left: 42px;
  right: 12px;
  bottom: 4px;
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--muted-light);
}

/* Customers List Card */
.customer-list-wrap {
  display: grid;
  gap: 4px;
}

.customer-row {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 10px 6px;
  border-bottom: 1px solid var(--line-soft);
  border-radius: 10px;
}

.customer-row:last-child {
  border-bottom: 0;
}

.customer-row strong {
  display: block;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-strong);
}

.customer-row small {
  display: block;
  font-size: 11.5px;
  color: var(--muted);
}

.member-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
}

.member-badge.vip {
  background: var(--primary-soft);
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.member-badge.regular {
  background: var(--accent-soft);
  color: var(--accent);
}

.expand-circle-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  display: grid;
  place-items: center;
  margin: 12px auto 0;
  box-shadow: var(--shadow);
}

/* Delivery Maps & Upcoming Shipping Schedule Card */
.delivery-map {
  height: 220px;
  position: relative;
  background: radial-gradient(circle at 2px 2px, var(--line) 1.3px, transparent 0), var(--surface-2);
  background-size: 16px 16px;
  overflow: hidden;
  border-radius: 16px;
  border: 1px solid var(--line);
  margin-bottom: 20px;
}

.delivery-map svg {
  width: 100%;
  height: 100%;
  padding: 14px;
}

.delivery-map line {
  stroke: var(--purple);
  stroke-width: 0.7;
  stroke-dasharray: 2.2 1.2;
  opacity: 0.7;
}

.delivery-map circle {
  fill: var(--primary);
  stroke: #FFFFFF;
  stroke-width: 1.4;
}

.delivery-summary {
  position: absolute;
  left: 50%;
  top: 46%;
  transform: translate(-50%, -50%);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 16px;
  box-shadow: var(--shadow-hover);
  text-align: center;
}

.delivery-summary strong {
  display: block;
  font-size: 13px;
  color: var(--text-strong);
}

.delivery-summary span {
  display: block;
  font-size: 10.5px;
  color: var(--muted);
  margin-top: 2px;
}

.shipping-schedule-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.plane-badge {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--purple-soft);
  color: var(--purple);
  display: grid;
  place-items: center;
}

.shipping-schedule-head h3 {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  color: var(--text-strong);
}

.shipping-list {
  display: grid;
  gap: 10px;
}

.shipping-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
}

.shipping-item strong {
  display: block;
  font-size: 13px;
  color: var(--text-strong);
}

.shipping-item span {
  display: block;
  font-size: 11.5px;
  color: var(--primary);
  font-weight: 500;
  margin: 2px 0;
}

.shipping-item small {
  display: block;
  font-size: 11px;
  color: var(--muted);
}

.pin-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 0;
  background: var(--purple);
  color: #FFFFFF;
  display: grid;
  place-items: center;
  box-shadow: 0 6px 14px rgba(108, 93, 211, 0.25);
}

/* ==========================================================================
   RESTAURANT POS MODULES: MESAS, COCINA, CAJA, RESUMEN, INVENTARIO
   ========================================================================== */

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
  margin-bottom: 22px;
}

.section-tools,
.list-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.section-tools h2,
.list-toolbar h2 {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
  color: var(--text-strong);
}

.section-tools p,
.list-toolbar p {
  margin: 4px 0 0;
  font-size: 12.5px;
  color: var(--muted);
}

.legend {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: var(--muted);
}

.legend i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 5px;
}

.legend .free { background: var(--success); }
.legend .busy { background: var(--warning); }

.tables-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
}

.table-card {
  min-height: 172px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  text-align: left;
  padding: 20px;
  color: var(--text);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.table-card:hover {
  transform: translateY(-3px);
  border-color: var(--primary);
  box-shadow: var(--shadow-hover);
}

.table-card.busy {
  background: var(--warning-soft);
  border-color: var(--warning);
}

.table-card > div,
.table-card footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.table-card strong {
  font-size: 17px;
  color: var(--text-strong);
}

.table-card p {
  color: var(--muted);
  font-size: 12px;
  margin: 12px 0;
}

.table-card footer {
  padding-top: 12px;
  border-top: 1px solid var(--line);
  font-size: 12px;
}

.status {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 11px;
  font-weight: 700;
}

.status.pending { background: var(--warning-soft); color: var(--warning); }
.status.progress { background: var(--purple-soft); color: var(--purple); }
.status.ready { background: var(--primary-soft); color: var(--primary); }
.status.paid { background: var(--success-soft); color: var(--success); }
.status.cancelled { background: var(--danger-soft); color: var(--danger); }

/* Modals (POS Order Builder & Confirm Reset Day Modal) */
.modal-layer {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.62);
  backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  padding: 20px;
  z-index: 80;
}

.modal-card {
  width: min(1020px, 96vw);
  max-height: 90vh;
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
}

.modal-card.confirm-dialog {
  width: min(460px, 94vw);
  padding: 26px;
}

.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.modal-head small {
  color: var(--primary);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 1px;
}

.modal-head h2 {
  margin: 4px 0 0;
  font-size: 20px;
}

.modal-close-btn {
  width: 38px;
  height: 38px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--text);
  font-size: 20px;
}

.order-builder {
  display: grid;
  grid-template-columns: 1.25fr 0.85fr;
}

.order-builder > div {
  padding: 22px;
  max-height: 72vh;
  overflow: auto;
}

.cart-panel {
  background: var(--surface-2);
  border-left: 1px solid var(--line);
}

.product-pick {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.product-pick > button {
  display: grid;
  grid-template-columns: 1fr auto 32px;
  gap: 10px;
  align-items: center;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  padding: 12px;
  color: var(--text);
}

.product-pick > button:hover {
  border-color: var(--primary);
}

.product-pick strong {
  display: block;
  font-size: 12.5px;
  color: var(--text-strong);
}

.product-pick small {
  display: block;
  color: var(--muted);
  font-size: 10.5px;
  margin-top: 2px;
}

.product-pick b {
  font-size: 12px;
  color: var(--primary);
}

.product-pick i {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--primary-soft);
  color: var(--primary);
  font-style: normal;
  font-weight: 800;
}

.cart-row {
  display: grid;
  grid-template-columns: 1fr auto auto 28px;
  gap: 8px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}

.qty-controls {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.qty-controls button {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font-weight: 700;
}

.cart-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 0;
}

.cart-total strong {
  font-size: 22px;
  color: var(--primary);
}

/* Kitchen Kanban */
.kanban {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
  align-items: start;
}

.kanban-col {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
}

.kanban-col > header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 14px;
}

.kanban-col h2 {
  font-size: 15px;
  margin: 0;
  color: var(--text-strong);
}

.kanban-col > header span {
  background: var(--primary-soft);
  color: var(--primary);
  font-weight: 700;
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 11.5px;
}

.kitchen-ticket {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}

.kitchen-ticket > div {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.kitchen-ticket ul {
  padding-left: 18px;
  font-size: 12.5px;
  line-height: 1.75;
  margin: 10px 0 14px;
}

.kitchen-ticket .primary {
  width: 100%;
}

/* Cashier & Summary */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.cash-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  box-shadow: var(--shadow);
}

.cash-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.cash-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
}

.summary-actions {
  display: flex;
  gap: 10px;

}

.secondary,
.danger {
  min-height: 42px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  border-radius: 999px;
  padding: 9px 18px;
  font-size: 12.5px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.danger {
  border-color: var(--danger);
  color: var(--danger);
  background: var(--danger-soft);
}

.danger:hover:not(:disabled) {
  background: var(--danger);
  color: #FFFFFF;
}

/* Data Tables & Inventory */
.table-scroll {
  overflow-x: auto;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  white-space: nowrap;
}

.data-table th {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--muted);
  text-align: left;
  padding: 13px 12px;
  border-bottom: 1px solid var(--line);
}

.data-table td {
  padding: 14px 12px;
  border-bottom: 1px solid var(--line-soft);
  font-size: 13px;
}

.inventory-layout,
.detail-layout,
.analytics-grid,
.split-grid {
  display: grid;
  grid-template-columns: 1.35fr 0.85fr;
  gap: 20px;
}

.inventory-form form {
  display: grid;
  gap: 12px;
}

.inventory-form label,
.form-demo label,
.wizard label,
.custom-page label {
  display: grid;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-strong);
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.actions {
  display: flex;
  gap: 6px;
}

.actions button,
.danger-icon {
  width: 34px;
  height: 34px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  color: var(--muted);
  display: grid;
  place-items: center;
}

.danger-icon {
  color: var(--danger) !important;
}

.stock-badge {
  display: inline-grid;
  place-items: center;
  min-width: 34px;
  padding: 4px 9px;
  border-radius: 8px;
  background: var(--success-soft);
  color: var(--success);
  font-weight: 700;
}

.stock-badge.low {
  background: var(--danger-soft);
  color: var(--danger);
}

.customer-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}

.customer-card {
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  background: var(--surface-2);
}

.avatar.big {
  width: 58px;
  height: 58px;
  margin: 0 auto 10px;
  font-size: 16px;
}

.bar-chart {
  height: 220px;
  display: flex;
  align-items: flex-end;
  gap: 14px;
  padding: 20px 8px 4px;
}

.bar-chart > div {
  height: 100%;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
}

.bar-chart i {
  width: 100%;
  max-width: 36px;
  border-radius: 8px 8px 3px 3px;
  background: linear-gradient(180deg, var(--primary-2), var(--primary));
}

.donut-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
  min-height: 220px;
}

.donut {
  width: 148px;
  height: 148px;
  border-radius: 50%;
  background: conic-gradient(var(--primary) 0 46%, var(--accent) 46% 79%, var(--purple) 79%);
  display: grid;
  place-items: center;
  position: relative;
}

.donut::after {
  content: '';
  position: absolute;
  inset: 28px;
  background: var(--surface);
  border-radius: 50%;
}

.donut span {
  z-index: 1;
  font-weight: 800;
  font-size: 19px;
}

.empty-state {
  padding: 28px;
  border: 1px dashed var(--line);
  border-radius: 14px;
  color: var(--muted);
  text-align: center;
  font-size: 12.5px;
}

.empty-state.wide {
  grid-column: 1 / -1;
}

.floating-dock {
  position: fixed;
  right: 18px;
  bottom: 24px;
  z-index: 70;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.dock-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 0;
  background: var(--primary);
  color: #FFFFFF;
  display: grid;
  place-items: center;
  box-shadow: 0 10px 24px var(--primary-ring);
}

.dock-btn.alt {
  background: var(--purple);
}

.palette-modal-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 14px;
}

.palette-card {
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  background: var(--surface-2);
  text-align: left;
  color: var(--text);
}

.palette-card.active {
  border-color: var(--primary);
  background: var(--primary-soft);
}

.swatch-row {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}

.swatch-row i {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: inline-block;
}

.footer {
  padding: 20px 34px 28px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  border-top: 1px solid var(--line-soft);
}

.footer b {
  color: var(--primary);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  z-index: 100;
  background: var(--text-strong);
  color: #FFFFFF;
  border-radius: 999px;
  padding: 12px 22px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
  font-size: 13px;
  font-weight: 500;
}

@media (max-width: 1260px) {
  .lezato-top-grid,

function usePersistentState(key, fallback) {
  const [value, setValue] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  });
  useEffect(() => {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch {
      // Safe fallback in restricted storage environments
    }
  }, [key, value]);
  return [value, setValue];
}

function PageRouter(props) {
  const { active } = props;
  if (active === 'inicio') return <Dashboard {...props} />;
  if (active === 'mesas') return <TablesView {...props} />;
  if (active === 'cocina') return <Kitchen {...props} />;
  if (active === 'caja') return <Cashier {...props} />;
  if (active === 'resumen') return <Summary {...props} />;
  if (active === 'pedidos') return <Orders {...props} />;
  if (active === 'detalle-pedido') return <OrderDetail {...props} />;
  if (active === 'clientes') return <Customers {...props} />;
  if (active === 'analitica') return <Analytics {...props} />;
  if (active === 'resenas') return <Reviews {...props} />;
  if (active === 'tareas') return <TasksView {...props} />;
  if (active === 'inventario-productos') return <Inventory {...props} />;
  if (active === 'inventario-categorias') return <Categories {...props} />;
  if (active === 'inventario-movimientos') return <Movements {...props} />;
  if (active.startsWith('grafico-')) return <Charts type={active.replace('grafico-', '')} {...props} />;
  if (active === 'sistema-formularios') return <Forms {...props} />;
  if (active === 'sistema-tablas') return <DataTables {...props} />;
  if (active.startsWith('custom-')) return <CustomPage active={active} {...props} />;
  return <Dashboard {...props} />;
}

function StatCard({ label, value, detail, icon, percent = 75, alert }) {
  const radius = 28;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference - (percent / 100) * circumference;

  return (
    <article className="stat-card">
      <div className="stat-info">
        <strong>{value}</strong>
        <span>{label}</span>
        <small className={alert ? 'danger-text' : ''}>{detail}</small>
      </div>
      <div className="stat-donut-ring">
        <svg className="ring-svg" viewBox="0 0 68 68">
          <circle className="ring-bg" cx="34" cy="34" r={radius} />
          <circle
            className="ring-meter"
            cx="34"
            cy="34"
            r={radius}
            strokeDasharray={circumference}
            strokeDashoffset={offset}
          />
        </svg>
        <span className="stat-donut-inner">
          <SvgIcon name={icon} size={20} />
        </span>
      </div>
    </article>
  );
}

   VISTA 2: SALÓN, MESAS Y CREADOR DE PEDIDOS POS
   ========================================================================== */

function TablesView({ orders, setOrders, inventory, toast }) {
  const [selected, setSelected] = useState(null);
  const [cart, setCart] = useState([]);
  const [catFilter, setCatFilter] = useState('Todas');
  const [clientName, setClientName] = useState('');

  const tables = Array.from({ length: 8 }, (_, i) => i + 1);
  const categories = ['Todas', ...new Set(inventory.map(p => p.categoria))];
  const tableOrder = (n) => orders.find(o => o.mesa === n && o.estado !== 'Entregado');

  const add = (p) => {
    setCart(c => {
      const found = c.find(x => x.id === p.id);
      return found
        ? c.map(x => x.id === p.id ? { ...x, qty: x.qty + 1 } : x)
        : [...c, { ...p, qty: 1 }];
    });
  };

  const adjustQty = (id, delta) => {
    setCart(c => c.map(x => x.id === id ? { ...x, qty: x.qty + delta } : x).filter(x => x.qty > 0));
  };

  const total = cart.reduce((s, p) => s + p.precio * p.qty, 0);

  const sendToKitchen = () => {
    if (!selected || !cart.length) return;
    const nextId = Math.max(...orders.map(o => o.id), 1000) + 1;
    const order = {
      id: nextId,
      mesa: selected,
      cliente: clientName.trim() || `Mesa ${String(selected).padStart(2, '0')}`,
      direccion: `Mesa ${String(selected).padStart(2, '0')} · Salón Principal`,
      total,
      estado: 'Pendiente',
      items: cart.map(p => `${p.qty} × ${p.nombre}`),
      hora: timePE()
    };
    setOrders([order, ...orders]);
    setCart([]);
    setClientName('');
    setSelected(null);
    toast(`Pedido #${nextId} enviado a Cocina para la Mesa ${String(selected).padStart(2, '0')}.`);
  };

  const filteredMenu = inventory.filter(p => p.stock > 0 && (catFilter === 'Todas' || p.categoria === catFilter));

  return (
    <>
      <div className="section-tools">
        <div>
          <h2>Salón y Mesas (POS)</h2>
          <p>Selecciona cualquier mesa para tomar comanda y enviarla a Cocina en tiempo real.</p>
        </div>
        <span className="legend">
          <span><i className="free" />Libre</span>
          <span><i className="busy" />Ocupada / En Atención</span>
        </span>
      </div>

      <div className="tables-grid">
        {tables.map(n => {
          const o = tableOrder(n);
          return (
            <button
              type="button"
              key={n}
              className={`table-card ${o ? 'busy' : ''}`}
              onClick={() => setSelected(n)}
            >
              <div>
                <strong>Mesa {String(n).padStart(2, '0')}</strong>
                <span className={`status ${o ? statusClass(o.estado) : 'paid'}`}>
                  {o ? o.estado : 'Libre'}
                </span>
              </div>
              <p>{o ? `Pedido #${o.id} · ${o.cliente}` : 'Disponible para asignar comensales'}</p>
              <footer>
                <span>{o ? 'Consumo actual' : 'Capacidad'}</span>
                <b>{o ? money(o.total) : `${[2, 4, 4, 6, 2, 4, 6, 8][n - 1]} personas`}</b>
              </footer>
            </button>
          );
        })}
      </div>

      {selected && (
        <div className="modal-layer" onMouseDown={() => setSelected(null)}>
          <div className="modal-card order-modal" onMouseDown={e => e.stopPropagation()}>
            <div className="modal-head">
              <div>
                <small>COMANDA POS · SALÓN PRINCIPAL</small>
                <h2>Mesa {String(selected).padStart(2, '0')}</h2>
              </div>
              <button type="button" className="modal-close-btn" onClick={() => setSelected(null)}>×</button>
            </div>
            <div className="order-builder">
              <div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px', flexWrap: 'wrap', gap: '8px' }}>
                  <h3 style={{ margin: 0 }}>Carta Disponible</h3>
                  <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
                    {categories.map(cat => (
                      <button
                        type="button"
                        key={cat}
                        className={`pill-tab ${catFilter === cat ? 'active' : ''}`}
                        onClick={() => setCatFilter(cat)}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="product-pick">
                  {filteredMenu.map(p => (
                    <button type="button" key={p.id} onClick={() => add(p)}>
                      <span>
                        <strong>{p.emoji || '🍽️'} {p.nombre}</strong>
                        <small>{p.categoria} · Stock: {p.stock}</small>
                      </span>
                      <b>{money(p.precio)}</b>
                      <i>+</i>
                    </button>
                  ))}
                </div>
              </div>

              <div className="cart-panel">
                <h3 style={{ marginTop: 0 }}>Detalle de Comanda</h3>
                <label style={{ display: 'grid', gap: '4px', fontSize: '12px', fontWeight: 600, marginBottom: '12px' }}>
                  Cliente / Referencia (opcional)
                  <input
                    value={clientName}
                    onChange={e => setClientName(e.target.value)}
                    placeholder={`Mesa ${String(selected).padStart(2, '0')}`}
                  />
                </label>

                {!cart.length ? (
                  <div className="empty-state">Selecciona platos de la carta para armar el pedido.</div>
                ) : (
                  cart.map(p => (
                    <div className="cart-row" key={p.id}>
                      <span>
                        <strong>{p.nombre}</strong>
                        <small>{money(p.precio)} c/u</small>
                      </span>
                      <div className="qty-controls">
                        <button type="button" onClick={() => adjustQty(p.id, -1)}>−</button>
                        <span style={{ fontSize: '12px', fontWeight: 700, padding: '0 4px' }}>{p.qty}</span>
                        <button type="button" onClick={() => adjustQty(p.id, 1)}>+</button>
                      </div>
                      <b>{money(p.qty * p.precio)}</b>
                      <button
                        type="button"
                        style={{ border: 0, background: 'transparent', color: 'var(--danger)', fontSize: '18px' }}
                        onClick={() => setCart(cart.filter(x => x.id !== p.id))}
                      >
                        ×
                      </button>
                    </div>
                  ))
                )}

                <div className="cart-total">
                  <span>Total a comandar</span>
                  <strong>{money(total)}</strong>
                </div>

                <button type="button" className="primary" style={{ width: '100%' }} disabled={!cart.length} onClick={sendToKitchen}>
                  Enviar Pedido a Cocina
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

/* ==========================================================================
   VISTA 3: COCINA (KDS KANBAN)
   ========================================================================== */

function Kitchen({ orders, setOrders, toast }) {
  const states = ['Pendiente', 'En preparación', 'Listo'];

  const advance = (id) => {
    setOrders(orders.map(o => {
      if (o.id !== id) return o;
      const next = o.estado === 'Pendiente' ? 'En preparación' : o.estado === 'En preparación' ? 'Listo' : 'Entregado';
      return { ...o, estado: next };
    }));
    toast('Estado del pedido actualizado en Cocina.');
  };

  return (
    <div className="kanban">
      {states.map(st => {
        const colOrders = orders.filter(o => o.estado === st);
        return (
          <section key={st} className="kanban-col">
            <header>
              <h2>{st}</h2>
              <span>{colOrders.length}</span>
            </header>
            {colOrders.map(o => (
              <article className="kitchen-ticket" key={o.id}>
                <div>
                  <strong>Mesa {String(o.mesa).padStart(2, '0')} · {o.cliente}</strong>
                  <small>{o.hora}</small>
                </div>
                <p style={{ margin: '4px 0', fontSize: '12px', color: 'var(--primary)', fontWeight: 600 }}>
                  Pedido #{o.id} ({money(o.total)})
                </p>
                <ul>
                  {o.items.map((x, i) => <li key={i}>{x}</li>)}
                </ul>
                <button type="button" className="primary" onClick={() => advance(o.id)}>
                  {st === 'Pendiente' ? 'Comenzar Preparación' : st === 'En preparación' ? 'Marcar Listo para Servir' : 'Entregar a Mesa / Caja'}
                </button>
              </article>
            ))}
            {!colOrders.length && <div className="empty-state">Sin comandas en estado &ldquo;{st}&rdquo;.</div>}
          </section>
        );
      })}
    </div>
  );
}

/* ==========================================================================
   VISTA 4: CAJA Y COBROS ACUMULADOS
   ========================================================================== */

function Cashier({ orders, setOrders, payments, setPayments, toast, go }) {
  const billable = orders.filter(o => o.estado === 'Entregado' || o.estado === 'Listo');
  const [methods, setMethods] = useState({});

  const registerPayment = (order) => {
    const now = new Date();
    const payment = {
      id: uid(),
      pedidoId: order.id,
      mesa: order.mesa,
      cliente: order.cliente,
      total: order.total,
      metodo: methods[order.id] || 'Yape',
      dia: dayKey(now),
      hora: timePE(now),
      creadoEn: now.toISOString()
    };

    // Se guarda en el historial persistente de cobros antes de liberar la mesa
    setPayments([payment, ...(payments || [])]);
    setOrders(orders.filter(x => x.id !== order.id));
    toast(`Cobro de ${money(order.total)} (${payment.metodo}) registrado y acumulado en Resumen del Día.`);
  };

  return (
    <>
      <div className="section-tools">
        <div>
          <h2>Terminal de Caja y Liquidación</h2>
          <p>Cada cobro registrado libera la mesa automáticamente y se suma al historial acumulado del día.</p>
        </div>
        <button type="button" className="secondary" onClick={() => go('resumen')}>
          Ver Resumen del Día →
        </button>
      </div>

      <div className="cards-grid">
        {billable.map(o => (
          <article className="cash-card" key={o.id}>
            <div className="cash-head">
              <div>
                <small style={{ color: 'var(--muted)', fontWeight: 700 }}>CUENTA LISTA</small>
                <h2 style={{ margin: '4px 0 12px' }}>Mesa {String(o.mesa).padStart(2, '0')}</h2>
              </div>
              <span className={`status ${statusClass(o.estado)}`}>Pedido #{o.id}</span>
            </div>
            <div style={{ marginBottom: '10px' }}>
              {o.items.map((x, i) => (
                <div key={i} style={{ padding: '7px 0', borderBottom: '1px solid var(--line-soft)', fontSize: '12.5px' }}>
                  {x}
                </div>
              ))}
            </div>
            <div className="cash-total">
              <span>Total a cobrar</span>
              <strong>{money(o.total)}</strong>
            </div>
            <select
              value={methods[o.id] || 'Yape'}
              onChange={e => setMethods({ ...methods, [o.id]: e.target.value })}
            >
              <option value="Yape">Yape</option>
              <option value="Plin">Plin</option>
              <option value="Efectivo">Efectivo</option>
              <option value="Tarjeta">Tarjeta Visa / Mastercard</option>
            </select>
            <button type="button" className="primary" onClick={() => registerPayment(o)}>
              Registrar Cobro y Liberar Mesa
            </button>
          </article>
        ))}

        {!billable.length && (
          <div className="panel empty-state wide">
            No hay cuentas pendientes de cobro en este momento. Avanza un pedido a &ldquo;Listo&rdquo; o &ldquo;Entregado&rdquo; desde Cocina.
          </div>
        )}
      </div>
    </>
  );
}

function Summary({ orders, inventory, payments = [], setPayments, toast }) {
  const [confirmOpen, setConfirmOpen] = useState(false);
  const today = dayKey();
  const todayPayments = payments.filter(p => p.dia === today);
  const totalToday = todayPayments.reduce((s, p) => s + p.total, 0);
  const currentOrdersTotal = orders.reduce((s, o) => s + o.total, 0);

  const confirmResetDay = () => {
    // Elimina únicamente los cobros del día actual; pedidos activos e inventario permanecen intactos
    setPayments(payments.filter(p => p.dia !== today));
    setConfirmOpen(false);
    toast('Resumen diario reiniciado. El acumulado de hoy volvió a S/ 0.00.');
  };

  return (
    <>
      <section className="stats-grid">
        <StatCard label="Cobrado Hoy" value={money(totalToday)} detail="Suma acumulada en Caja hoy" icon="dollar" percent={88} />
        <StatCard label="Cobros del Día" value={todayPayments.length} detail="Transacciones liquidadas" icon="orders" percent={72} />
        <StatCard label="Pedidos Activos" value={orders.length} detail={`${money(currentOrdersTotal)} en atención`} icon="cup" percent={64} />
        <StatCard label="Unidades en Stock" value={inventory.reduce((s, p) => s + p.stock, 0)} detail="Disponibles en almacén" icon="inventory" percent={79} />
      </section>

      <div className="panel">
        <div className="summary-toolbar">
          <div className="panel-title" style={{ marginBottom: 0 }}>
            <div>
              <h2>Cobros Acumulados de Hoy ({today})</h2>
              <p>Cada pago registrado en Caja se conserva aquí aunque la mesa sea liberada.</p>
            </div>
          </div>

          <div className="summary-actions">
            <button
              type="button"
              className="danger"
              onClick={() => setConfirmOpen(true)}
              disabled={!todayPayments.length}
              title="Borrar el acumulado del día actual y empezar desde S/ 0.00"
            >
              <SvgIcon name="trash" size={16} />
              Reiniciar día
            </button>
          </div>
        </div>

        {todayPayments.length ? (
          <div className="table-scroll">
            <table className="data-table">
              <thead>
                <tr>
                  <th>Pedido</th>
                  <th>Mesa / Cliente</th>
                  <th>Hora</th>
                  <th>Método de Pago</th>
                  <th>Total Cobrado</th>
                </tr>
              </thead>
              <tbody>
                {todayPayments.map(p => (
                  <tr key={p.id}>
                    <td><strong>#{p.pedidoId}</strong></td>
                    <td>Mesa {String(p.mesa).padStart(2, '0')} {p.cliente ? `· ${p.cliente}` : ''}</td>
                    <td>{p.hora}</td>
                    <td><span className="status ready">{p.metodo}</span></td>
                    <td><strong>{money(p.total)}</strong></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ) : (
          <div className="empty-state">
            El resumen del día está en <strong>S/ 0.00</strong>. Registra un cobro en Caja para comenzar a acumular ventas.
          </div>
        )}
      </div>

      {confirmOpen && (
        <div className="modal-layer" onMouseDown={() => setConfirmOpen(false)}>
          <div className="modal-card confirm-dialog" onMouseDown={e => e.stopPropagation()}>
            <h3 style={{ margin: '0 0 8px', fontSize: '18px' }}>¿Iniciar un nuevo día operativo?</h3>
            <p style={{ margin: '0 0 20px', color: 'var(--muted)', fontSize: '13px', lineHeight: 1.55 }}>
              Se borrarán del resumen los <strong>{todayPayments.length} cobros acumulados de hoy ({money(totalToday)})</strong> y el contador diario volverá a <strong>S/ 0.00</strong>. Los pedidos activos y el inventario no se modificarán.
            </p>
            <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '10px' }}>
              <button type="button" className="secondary" onClick={() => setConfirmOpen(false)}>
                Cancelar
              </button>
              <button type="button" className="danger" onClick={confirmResetDay}>
                Sí, reiniciar a S/ 0.00
              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

const statusClass = st =>
  st === 'Pendiente' ? 'pending' : st === 'En preparación' ? 'progress' : st === 'Listo' ? 'ready' : 'paid';

  if (!o) return <div className="panel empty-state">No hay pedidos activos para mostrar.</div>;

  const stepIndex = o.estado === 'Pendiente' ? 1 : o.estado === 'En preparación' ? 2 : o.estado === 'Listo' ? 3 : 4;
  const steps = ['Pedido recibido', 'Confirmado por cocina', 'En preparación culinaria', 'Listo para servir / despacho', 'Entregado al cliente'];

  return (
    <>
      <div style={{ display: 'flex', gap: '8px', marginBottom: '16px', flexWrap: 'wrap' }}>
        {orders.map(ord => (
          <button
            type="button"
            key={ord.id}
            className={`pill-tab ${ord.id === o.id ? 'active' : ''}`}
            onClick={() => setSelectedOrderId(ord.id)}
          >
            Pedido #{ord.id} · Mesa {ord.mesa}
          </button>
        ))}
      </div>

      <div className="detail-layout">
        <article className="panel">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', borderBottom: '1px solid var(--line)', paddingBottom: '16px', marginBottom: '16px' }}>
            <div>
              <small style={{ color: 'var(--primary)', fontWeight: 700 }}>ORDER DETAILS · #{o.id}</small>
              <h2 style={{ margin: '4px 0' }}>{o.cliente} — Mesa {String(o.mesa).padStart(2, '0')}</h2>
              <p style={{ margin: 0, color: 'var(--muted)', fontSize: '12.5px' }}>{o.direccion || 'Salón Principal'} · Creado a las {o.hora}</p>
            </div>
            <span className={`status ${statusClass(o.estado)}`}>{o.estado}</span>
          </div>

          <h3 style={{ fontSize: '14px', marginBottom: '10px' }}>Ítems de la Comanda</h3>
          {o.items.map((x, i) => (
            <div key={i} style={{ display: 'flex', justifyContent: 'space-between', padding: '11px 0', borderBottom: '1px solid var(--line-soft)', fontSize: '13px' }}>
              <strong>{x}</strong>
              <span style={{ color: 'var(--success)', fontWeight: 600 }}>Confirmado</span>
            </div>
          ))}

          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '18px', paddingTop: '14px' }}>
            <span style={{ fontSize: '14px', fontWeight: 600 }}>Total de la Orden</span>
            <strong style={{ fontSize: '24px', color: 'var(--primary)' }}>{money(o.total)}</strong>
          </div>
        </article>

        <aside className="panel">
          <h2 style={{ marginTop: 0, fontSize: '17px' }}>Order Tracking · Seguimiento</h2>
          <div style={{ display: 'grid', gap: '12px', marginTop: '14px' }}>
            {steps.map((label, i) => {
              const done = i <= stepIndex;
              return (
                <div key={label} style={{ display: 'flex', gap: '12px', alignItems: 'center' }}>
                  <span style={{
                    width: '32px',
                    height: '32px',
                    borderRadius: '50%',
                    display: 'grid',
                    placeItems: 'center',
                    background: done ? 'var(--primary)' : 'var(--surface-3)',
                    color: done ? '#fff' : 'var(--muted)',
                    fontWeight: 700,
                    fontSize: '12px'
                  }}>
                    {done ? '✓' : i + 1}
                  </span>
                  <div>
                    <strong style={{ display: 'block', fontSize: '13px' }}>{label}</strong>
                    <small style={{ color: 'var(--muted)', fontSize: '11px' }}>{done ? 'Completado' : 'En espera'}</small>
                  </div>
                </div>
              );
            })}
          </div>
        </aside>
      </div>
    </>
  );
}

function Inventory({ inventory, setInventory, toast }) {
  const blank = { nombre: '', categoria: 'Platos', stock: 15, minimo: 5, precio: 20, emoji: '🍽️' };
  const [form, setForm] = useState(blank);
  const [editing, setEditing] = useState(null);
  const [query, setQuery] = useState('');

  const save = (e) => {
    e.preventDefault();
    if (!form.nombre.trim()) return;
    if (editing) {
      setInventory(inventory.map(p => p.id === editing ? { ...form, id: editing } : p));
      toast('Producto actualizado en la carta.');
    } else {
      setInventory([...inventory, { ...form, id: uid(), vendidos: 12 }]);
      toast('Nuevo producto incorporado al inventario.');
    }
    setForm(blank);
    setEditing(null);
  };

  const edit = (p) => { setEditing(p.id); setForm({ ...p }); };
  const remove = (id) => { setInventory(inventory.filter(p => p.id !== id)); toast('Producto eliminado del inventario.'); };
  const list = inventory.filter(p => p.nombre.toLowerCase().includes(query.toLowerCase()));

  return (
    <div className="inventory-layout">
      <section className="panel">
        <div className="list-toolbar">
          <div>
            <h2>Inventario de Productos y Carta</h2>
            <p>{inventory.length} ítems activos sincronizados con Salón y Dashboard.</p>
          </div>
          <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Buscar plato o bebida..." style={{ maxWidth: '240px' }} />
        </div>
        <div className="table-scroll">
          <table className="data-table">
            <thead>
              <tr>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Stock</th>
                <th>Mínimo</th>
                <th>Precio</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              {list.map(p => (
                <tr key={p.id}>
                  <td><strong>{p.emoji || '🍽️'} {p.nombre}</strong></td>
                  <td>{p.categoria}</td>
                  <td><span className={`stock-badge ${p.stock <= p.minimo ? 'low' : ''}`}>{p.stock}</span></td>
                  <td>{p.minimo}</td>
                  <td><strong>{money(p.precio)}</strong></td>
                  <td className="actions">
                    <button type="button" onClick={() => edit(p)} title="Editar"><SvgIcon name="edit" size={15} /></button>
                    <button type="button" className="danger-icon" onClick={() => remove(p.id)} title="Eliminar"><SvgIcon name="trash" size={15} /></button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>

      <aside className="panel inventory-form">
        <h2>{editing ? 'Editar Producto' : 'Nuevo Producto'}</h2>
        <p style={{ color: 'var(--muted)', fontSize: '12px' }}>Los cambios se guardan automáticamente en el navegador.</p>
        <form onSubmit={save}>
          <label>Nombre del plato / producto<input value={form.nombre} onChange={e => setForm({ ...form, nombre: e.target.value })} placeholder="Ej. Chaufa de mariscos" /></label>
          <div className="form-grid">
            <label>Categoría
              <select value={form.categoria} onChange={e => setForm({ ...form, categoria: e.target.value })}>
                <option>Platos</option>
                <option>Entradas</option>
                <option>Bebidas</option>
                <option>Postres</option>
                <option>Insumos</option>
              </select>
            </label>
            <label>Icono / Emoji<input value={form.emoji || '🍽️'} onChange={e => setForm({ ...form, emoji: e.target.value })} /></label>
          </div>
          <div className="form-grid">
            <label>Stock Actual<input type="number" min="0" value={form.stock} onChange={e => setForm({ ...form, stock: +e.target.value })} /></label>
            <label>Stock Mínimo<input type="number" min="0" value={form.minimo} onChange={e => setForm({ ...form, minimo: +e.target.value })} /></label>
          </div>
          <label>Precio de Venta (S/)<input type="number" min="0" step="0.1" value={form.precio} onChange={e => setForm({ ...form, precio: +e.target.value })} /></label>
          <button className="primary" type="submit">{editing ? 'Guardar Cambios' : 'Agregar a la Carta'}</button>
          {editing && <button type="button" className="secondary" onClick={() => { setEditing(null); setForm(blank); }}>Cancelar</button>}
        </form>
      </aside>
    </div>
  );
}
